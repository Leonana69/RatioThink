[package]
name = "probability-lens"
version = "0.1.0"
edition = "2024"
description = "Probability Lens inferlet: confidence-colored chat with token alternatives."

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../Vendor/pie/sdk/rust/inferlet" }
gen-core = { path = "../gen-core" }
ratio-wire = { path = "../ratio-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
