[package]
name = "next-token-arena"
version = "0.1.0"
edition = "2024"
description = "Next Token Arena inferlet: top-token logits plus forked branch previews."

[lib]
crate-type = ["cdylib"]

[dependencies]
inferlet = { path = "../../Vendor/pie/sdk/rust/inferlet" }
gen-core = { path = "../gen-core" }
ratio-wire = { path = "../ratio-wire" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
